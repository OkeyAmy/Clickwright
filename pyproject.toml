[project]
name = "clickwright"
version = "0.1.0"
description = "Compiles GUI-only systems into governed, agent-callable connectors."
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.7.1",
    "google-genai>=2.19.0",
    "playwright>=1.52.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    # only used when CLICKWRIGHT_MODEL_BASE_URL points at an OpenAI-compatible
    # endpoint; the Gemini path never imports it
    "openai>=1.60",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-pubsub>=2.23",
    "opentelemetry-exporter-gcp-trace>=1.7",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
