{% extends "_base.html" %}
{% block crumb %}Sign in{% endblock %}
{% block content %}
<form method="post" action="/{{ tenant }}/login">
  <table>
    <tr><td class="lbl">User ID</td><td><input type="text" id="ctl00_user" name="username" autocomplete="off"></td></tr>
    <tr><td class="lbl">Password</td><td><input type="password" id="ctl00_pass" name="password" autocomplete="off"></td></tr>
  </table>
  <div class="foot">
    <button class="btn" type="submit" id="ctl00_signin">Sign In</button>
    <span class="note">Access is logged under policy 14-B.</span>
  </div>
</form>
{% endblock %}
